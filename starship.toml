# ~/.config/starship.toml — minimal look

add_newline = false

format = """
$directory$git_branch$git_status
$character"""

[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style))"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Hide everything else for a clean look
[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[cmd_duration]
disabled = true

[battery]
disabled = true

[username]
disabled = true

[hostname]
disabled = true
